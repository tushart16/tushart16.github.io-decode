<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Stick Decoder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #eef1f6;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
        }

        h1 {
            color: #3b9766;
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .instructions {
            text-align: center;
            color: #5c6b79;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            color: #4a5568;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]::placeholder {
            color: #a0aec0;
        }

        input[type="text"]:focus {
            border-color: #3b9766;
        }

        button {
            width: 100%;
            background-color: #3b9766;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(59, 151, 102, 0.2);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #328257;
        }

        /* Output Boxes mimicking the image */
        .output-box-green {
            margin-top: 25px;
            min-height: 40px;
            background-color: #eafbf0;
            border: 1px solid #b7e4c7;
            border-radius: 6px;
            padding: 10px 15px;
            box-sizing: border-box;
            color: #2d6a4f;
            font-weight: 500;
        }

        .output-box-orange {
            margin-top: 15px;
            min-height: 40px;
            background-color: #fff6ef;
            border: 1px solid #f9dcc4;
            border-radius: 6px;
            padding: 10px 15px;
            box-sizing: border-box;
            color: #b05c2a;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LED Stick Decoder</h1>
        
        <div class="instructions">
            Enter positive integers to calculate the total number of lines in the LED display based on digit occurrences.
        </div>

        <div class="input-group">
            <label for="positiveIntegers">Input positive integers:</label>
            <input type="text" id="positiveIntegers" placeholder="e.g., 123456">
        </div>

        <!-- The button logic is intentionally left blank per your request -->
        <button id="answerBtn">Answer</button>

        <!-- Empty output boxes ready to be populated by your future JS logic -->
        <div class="output-box-green" id="outputSum"></div>
        <div class="output-box-orange" id="outputBreakdown"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another Easy Decoding?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #eef1f6;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
        }

        h1 {
            color: #3b9766;
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .instructions {
            text-align: center;
            color: #5c6b79;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            color: #4a5568;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]::placeholder {
            color: #a0aec0;
        }

        input[type="text"]:focus {
            border-color: #3b9766;
        }

        button {
            width: 100%;
            background-color: #3b9766;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(59, 151, 102, 0.2);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #328257;
        }

        /* Output Boxes mimicking the image */
        .output-box-green {
            margin-top: 25px;
            min-height: 40px;
            background-color: #eafbf0;
            border: 1px solid #b7e4c7;
            border-radius: 6px;
            padding: 10px 15px;
            box-sizing: border-box;
            color: #2d6a4f;
            font-weight: 600;
            display: none; /* Hidden by default */
        }

        .output-box-orange {
            margin-top: 15px;
            min-height: 40px;
            background-color: #fff6ef;
            border: 1px solid #f9dcc4;
            border-radius: 6px;
            padding: 10px 15px;
            box-sizing: border-box;
            color: #b05c2a;
            font-weight: 500;
            line-height: 1.6;
            display: none; /* Hidden by default */
        }

        .error-text {
            color: #c53030;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Another Easy Decoding?</h1>
        
        <div class="instructions">
            Enter positive integers to know the mystery
        </div>

        <div class="input-group">
            <label for="positiveIntegers">Input positive integers:</label>
            <input type="text" id="positiveIntegers" placeholder="e.g., 123456">
        </div>

        <!-- Added onclick event to trigger the logic -->
        <button id="answerBtn" onclick="calculateLEDSticks()">Answer</button>

        <div class="output-box-green" id="outputSum"></div>
        <div class="output-box-orange" id="outputBreakdown"></div>
    </div>

    <script>
        function calculateLEDSticks() {
            const inputVal = document.getElementById('positiveIntegers').value.trim();
            const outputSum = document.getElementById('outputSum');
            const outputBreakdown = document.getElementById('outputBreakdown');
            
            // Reset display states and styling
            outputSum.style.display = 'none';
            outputBreakdown.style.display = 'none';
            outputSum.className = 'output-box-green'; 
            outputSum.innerHTML = '';
            outputBreakdown.innerHTML = '';

            try {
                // Validation checks
                if (!inputVal) {
                    throw new Error("Input cannot be empty.");
                }
                
                // Regex checks that the input contains ONLY digits
                if (!/^\d+$/.test(inputVal)) {
                    throw new Error("Please enter valid positive integers only.");
                }

                // LED stick values mapped to indices 0-9
                const stickValues = [6, 2, 5, 5, 4, 5, 6, 3, 7, 6];
                
                // Array to store digit frequencies
                let digitCounts = new Array(10).fill(0);
                let totalSticks = 0;

                // Count frequencies
                for (let i = 0; i < inputVal.length; i++) {
                    let digit = parseInt(inputVal[i], 10);
                    digitCounts[digit]++;
                }

                // Build breakdown HTML and calculate total
                let breakdownHTML = '<strong>Breakdown:</strong><br>';
                
                for (let i = 0; i < 10; i++) {
                    if (digitCounts[i] > 0) {
                        let valueForDigit = digitCounts[i] * stickValues[i];
                        totalSticks += valueForDigit;
                        breakdownHTML += `Digit ${i} appeared ${digitCounts[i]} time(s) &times; ${stickValues[i]} sticks = ${valueForDigit}<br>`;
                    }
                }

                // Display success results
                outputSum.innerHTML = `Total Value: ${totalSticks}`;
                outputBreakdown.innerHTML = breakdownHTML;
                
                outputSum.style.display = 'block';
                outputBreakdown.style.display = 'block';

            } catch (e) {
                // Display error in the green box but style it red for failure
                outputSum.innerHTML = `<span class="error-text">Error: ${e.message}</span>`;
                outputSum.style.backgroundColor = "#fff5f5";
                outputSum.style.borderColor = "#fbd38d";
                outputSum.style.display = 'block';
            }
        }
    </script>

</body>
</html>
